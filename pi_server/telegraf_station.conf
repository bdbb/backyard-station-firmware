# /etc/telegraf/telegraf.d/station.conf
# MQTT (station/#) -> InfluxDB, plus a copy of every reading pushed to envi.

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "YOUR_INFLUXDB_TOKEN"
  organization = "envstation"
  bucket = "sensors"

[[outputs.http]]
  url = "https://envi.myrondomain.com/api/ingest"
  method = "POST"
  data_format = "json"
  namepass = ["env"]
  [outputs.http.headers]
    Content-Type = "application/json"
    Authorization = "Bearer YOUR_INGEST_SECRET"

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["station/#"]
  data_format = "json"
  name_override = "env"
